# Reverse proxy: serves the built Vue SPA, forwards /api/* to FastAPI.
# Internal Docker DNS name "api" resolves to the FastAPI container.
upstream fastapi {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Built frontend (copied from the node build stage).
    root /usr/share/nginx/html;
    index index.html;

    # API -> FastAPI (keep /api prefix: routes are registered as /api/*).
    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Swagger / OpenAPI docs served by FastAPI.
    location /docs {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: static assets + history-mode fallback to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
